    <!-- ШРИФТ DynaPuff ТОЛЬКО ДЛЯ CT FAMILY -->
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700;800&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
                   ЧАСТЬ 1: ОБНУЛЕНИЕ И БАЗОВЫЕ СТИЛИ
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            padding: 70px 16px 40px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            max-width: 420px;
            width: 100%;
        }


        /* ============================================================
                   ЧАСТЬ 1: ГЛАВНАЯ СТРАНИЦА
                   ============================================================ */
        #page-main {
            display: block;
        }

        #page-main.hidden {
            display: none;
        }


        /* ============================================================
                   ЧАСТЬ 1: БРЕНД (CT FAMILY + Shop)
                   ============================================================ */
        .brand {
            text-align: center;
            padding: 6px 0 20px;
        }

        .brand-title {
            font-family: 'DynaPuff', cursive;
            font-weight: 800;
            font-size: 58px;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .brand-sub {
            font-family: 'DynaPuff', cursive;
            font-weight: 700;
            font-size: 28px;
            color: #d5d5dd;
            margin-top: 0px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }


        /* ============================================================
                   ЧАСТЬ 1: ТАБЛЕТКА С КАТЕГОРИЯМИ
                   ============================================================ */
        .category-wrapper {
            background: #1a1a1a;
            border-radius: 28px;
            padding: 14px 14px 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }


        /* ============================================================
                   ЧАСТЬ 1: КАРТОЧКА КАТЕГОРИИ
                   ============================================================ */
        .category-card {
            flex: 0 0 auto;
            width: 88px;
            background: #1f1f1f;
            border-radius: 14px;
            padding: 12px 4px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.12s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 96px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-card:active {
            transform: scale(0.94);
            background: #2a2a2a;
        }

        .category-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 4px;
            background: #141414;
        }

        .category-name {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 600;
            font-size: 12px;
            color: #f0f0f0;
            letter-spacing: 0.2px;
            line-height: 1.2;
        }

        .category-count {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            font-size: 9px;
            color: #7777aa;
            margin-top: 1px;
        }
    </style>
</head>

    <script>
        // ============================================================
        // ЧАСТЬ 4: ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.requestFullscreen();


        // ============================================================
        // ЧАСТЬ 4: ДАННЫЕ ТОВАРОВ (ПУСТО)
        // ============================================================
        const productsData = {
            'Telegram': [],
            'Brawl Stars': [],
            'Roblox': [],
            'Clash Royale': [],
            'Clash of Clans': [],
            'Standoff 2': []
        };


        // ============================================================
        // ЧАСТЬ 4: ДАННЫЕ ФИЛЬТРОВ ДЛЯ КАТЕГОРИЙ
        // ============================================================
        const filtersData = {
            'Telegram': ['Premium', 'Stars', 'Другое'],
            'Brawl Stars': ['Пропуски', 'Гемы'],
            'Roblox': ['Робуксы', 'Подписки'],
            'Clash Royale': ['Пропуски', 'Гемы'],
            'Clash of Clans': ['Пропуски', 'Гемы'],
            'Standoff 2': ['Пропуски', 'Gold']
        };


        let currentCategory = '';
        let currentFilter = 'all';
        let currentProducts = [];


        // ============================================================
        // ЧАСТЬ 4: ОТКРЫТЬ КАТЕГОРИЮ
        // ============================================================
        function openCategory(name, icon) {
            currentCategory = name;
            currentFilter = 'all';

            document.getElementById('page-main').classList.add('hidden');
            const pageCat = document.getElementById('page-category');
            pageCat.classList.add('visible');

            document.getElementById('catHeaderIcon').src = icon;
            document.getElementById('catHeaderTitle').textContent = name;

            // Загружаем товары
            const products = productsData[name] || [];
            currentProducts = products;

            // === ОБНОВЛЯЕМ ФИЛЬТРЫ ===
            const filters = filtersData[name] || [];
            const container = document.getElementById('filtersContainer');
            
            let html = `<div class="filter-chip active" data-filter="all" onclick="setFilter('all')">Все</div>`;
            filters.forEach(filter => {
                html += `<div class="filter-chip" data-filter="${filter}" onclick="setFilter('${filter}')">${filter}</div>`;
            });
            container.innerHTML = html;

            document.getElementById('searchInput').value = '';

            renderProducts(products);
        }


        // ============================================================
        // ЧАСТЬ 4: ЗАКРЫТЬ КАТЕГОРИЮ
        // ============================================================
        function closeCategory() {
            document.getElementById('page-main').classList.remove('hidden');
            document.getElementById('page-category').classList.remove('visible');
            currentCategory = '';
            currentProducts = [];
        }


        // ============================================================
        // ЧАСТЬ 4: УСТАНОВИТЬ ФИЛЬТР
        // ============================================================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(el => {
                el.classList.toggle('active', el.dataset.filter === filter);
            });
            filterProducts();
        }


        // ============================================================
        // ЧАСТЬ 4: ПОИСК + ФИЛЬТРАЦИЯ
        // ============================================================
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = currentProducts;

            if (query) {
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(query)
                );
            }

            renderProducts(filtered);
        }


        // ============================================================
        // ЧАСТЬ 4: ОТРИСОВКА ТОВАРОВ
        // ============================================================
        function renderProducts(products) {
            const container = document.getElementById('categoryProducts');

            if (!products || products.length === 0) {
                container.innerHTML = `<div class="empty-products">Товаров пока нет</div>`;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="product-card" onclick="buyProduct('${p.name}', '${p.price}')">
                    <img class="product-img" src="${document.getElementById('catHeaderIcon').src}" alt="${p.name}">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                    </div>
                    <div class="product-price">${p.price}</div>
                </div>
            `).join('');
        }


        // ============================================================
        // ЧАСТЬ 4: КУПИТЬ ТОВАР
        // ============================================================
        function buyProduct(name, price) {
            tg.sendData(JSON.stringify({
                action: 'buy',
                product: name,
                price: price,
                category: currentCategory
            }));
            tg.showAlert(`Вы выбрали: ${name} — ${price}`);
        }


        // ============================================================
        // ЧАСТЬ 4: КНОПКА "ПРЕДЛОЖЕНИЯ"
        // ============================================================
        function openMore() {
            tg.openLink('https://t.me/CT_FAMILY_DONAT/20');
        }
    </script>

</body>
    </html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CT FAMILY Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ШРИФТ DynaPuff -->
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            padding: 70px 16px 40px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            max-width: 420px;
            width: 100%;
        }

        /* ===== НАЗВАНИЕ ===== */
        .brand {
            text-align: center;
            padding: 6px 0 24px;
        }

        .brand-title {
            font-family: 'DynaPuff', cursive;
            font-weight: 800;
            font-size: 58px;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .brand-sub {
            font-family: 'DynaPuff', cursive;
            font-weight: 700;
            font-size: 28px;
            color: #d5d5dd;
            margin-top: 0px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* ===== КАТЕГОРИИ ===== */
        .category-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-card {
            flex: 0 0 auto;
            width: 120px;
            background: #141414;
            border-radius: 22px;
            padding: 24px 8px 20px;  /* ← увеличил вертикальные отступы */
            text-align: center;
            cursor: pointer;
            transition: all 0.12s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;  /* ← увеличил высоту */
        }

        .category-card:active {
            transform: scale(0.94);
            background: #1e1e1e;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .category-icon {
            font-size: 44px;  /* ← увеличил */
            line-height: 1;
            margin-bottom: 6px;
        }

        .category-name {
            font-family: 'DynaPuff', cursive;
            font-weight: 700;
            font-size: 16px;  /* ← увеличил */
            color: #f0f0f0;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .category-count {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            font-size: 12px;
            color: #7777aa;
            margin-top: 2px;
        }

        /* ===== ПОПУЛЯРНОЕ ===== */
        .popular-section {
            margin-top: 32px;
        }

        .popular-title {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .popular-placeholder {
            background: #141414;
            border-radius: 22px;
            padding: 44px 20px;
            text-align: center;
            border: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .popular-placeholder p {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            font-size: 15px;
            color: #555577;
            letter-spacing: 0.5px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 380px) {
            body {
                padding: 60px 12px 30px;
            }
            .brand-title {
                font-size: 44px;
            }
            .brand-sub {
                font-size: 22px;
                letter-spacing: 4px;
            }
            .category-card {
                width: 100px;
                min-height: 120px;  /* ← увеличил */
                padding: 18px 6px 14px;
            }
            .category-icon {
                font-size: 34px;
            }
            .category-name {
                font-size: 14px;
            }
            .popular-title {
                font-size: 18px;
            }
        }

        @media (max-height: 700px) {
            body {
                padding: 60px 16px 30px;
            }
            .brand-title {
                font-size: 44px;
            }
            .brand-sub {
                font-size: 22px;
            }
            .category-card {
                width: 100px;
                min-height: 120px;
                padding: 18px 6px 14px;
            }
            .category-icon {
                font-size: 34px;
            }
            .category-name {
                font-size: 14px;
            }
            .popular-section {
                margin-top: 24px;
            }
            .popular-placeholder {
                padding: 30px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <div class="brand">
            <div class="brand-title">CT FAMILY</div>
            <div class="brand-sub">Shop</div>
        </div>

        <div class="category-scroll">

            <div class="category-card" onclick="selectCategory('Telegram')">
                <div class="category-icon">📱</div>
                <div class="category-name">Telegram</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Brawl Stars')">
                <div class="category-icon">⚔️</div>
                <div class="category-name">Brawl Stars</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Roblox')">
                <div class="category-icon">🎮</div>
                <div class="category-name">Roblox</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Clash Royale')">
                <div class="category-icon">👑</div>
                <div class="category-name">Clash Royale</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Clash of Clans')">
                <div class="category-icon">🏰</div>
                <div class="category-name">Clash of Clans</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Standoff 2')">
                <div class="category-icon">🔫</div>
                <div class="category-name">Standoff 2</div>
                <div class="category-count">0 товаров</div>
            </div>

        </div>

        <div class="popular-section">
            <div class="popular-title">⭐ Популярное</div>
            <div class="popular-placeholder">
                <p>Товары появятся позже</p>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.requestFullscreen();

        function selectCategory(name) {
            tg.sendData(JSON.stringify({
                action: 'category',
                category: name
            }));
            tg.showAlert(`Вы выбрали категорию: ${name}`);
        }
    </script>

</body>
</html>

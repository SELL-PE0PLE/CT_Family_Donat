<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CT FAMILY Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Impact', 'Arial Black', 'Porkys', sans-serif;
            padding: 20px 16px 40px;
        }

        .app {
            max-width: 420px;
            margin: 0 auto;
        }

        /* ===== НАЗВАНИЕ СВЕРХУ ===== */
        .brand {
            text-align: center;
            margin-bottom: 4px;
        }

        .brand-title {
            font-family: 'Impact', 'Arial Black', 'Porkys', sans-serif;
            font-weight: 900;
            font-size: 52px;
            letter-spacing: 14px;
            color: #ffffff;
            text-transform: uppercase;
            transform: scaleX(1.06);
            line-height: 1.1;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.04);
        }

        .brand-sub {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 6px;
            color: #d5d5dd;
            text-transform: uppercase;
            margin-top: 0px;
            text-align: center;
        }

        .spacer {
            height: 28px;
        }

        /* ===== КАТЕГОРИИ (горизонтальный скролл) ===== */
        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-card {
            flex: 0 0 auto;
            width: 110px;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 16px 8px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.12s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 96px;
        }

        .category-card:active {
            transform: scale(0.94);
            background: #262626;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .category-icon {
            font-size: 34px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .category-name {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #f0f0f0;
            letter-spacing: 0.2px;
            line-height: 1.2;
        }

        .category-count {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-weight: 400;
            font-size: 10px;
            color: #7777aa;
            margin-top: 2px;
        }

        /* ===== БЛОК "ПОПУЛЯРНОЕ" (пока заглушка) ===== */
        .popular-section {
            margin-top: 32px;
        }

        .popular-title {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .popular-placeholder {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            border: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .popular-placeholder p {
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: #555577;
            letter-spacing: 0.5px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 380px) {
            .brand-title {
                font-size: 36px;
                letter-spacing: 10px;
            }
            .category-card {
                width: 90px;
                min-height: 80px;
                padding: 12px 6px 10px;
            }
            .category-icon {
                font-size: 28px;
            }
            .category-name {
                font-size: 11px;
            }
            .app {
                padding: 12px 8px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== НАЗВАНИЕ СВЕРХУ ===== -->
        <div class="brand">
            <div class="brand-title">CT FAMILY</div>
            <div class="brand-sub">Shop</div>
        </div>

        <div class="spacer"></div>

        <!-- ===== КАТЕГОРИИ (горизонтальный скролл) ===== -->
        <div class="category-scroll">

            <div class="category-card" onclick="selectCategory('Telegram')">
                <div class="category-icon">📱</div>
                <div class="category-name">Telegram</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Brawl Stars')">
                <div class="category-icon">⚔️</div>
                <div class="category-name">Brawl Stars</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Roblox')">
                <div class="category-icon">🎮</div>
                <div class="category-name">Roblox</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Clash Royale')">
                <div class="category-icon">👑</div>
                <div class="category-name">Clash Royale</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Clash of Clans')">
                <div class="category-icon">🏰</div>
                <div class="category-name">Clash of Clans</div>
                <div class="category-count">0 товаров</div>
            </div>

            <div class="category-card" onclick="selectCategory('Standoff 2')">
                <div class="category-icon">🔫</div>
                <div class="category-name">Standoff 2</div>
                <div class="category-count">0 товаров</div>
            </div>

        </div>

        <!-- ===== БЛОК "ПОПУЛЯРНОЕ" (ПОКА ПУСТО) ===== -->
        <div class="popular-section">
            <div class="popular-title">⭐ Популярное</div>
            <div class="popular-placeholder">
                <p>Товары появятся позже</p>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function selectCategory(name) {
            tg.sendData(JSON.stringify({
                action: 'category',
                category: name
            }));
            tg.showAlert(`Вы выбрали категорию: ${name}`);
        }
    </script>

</body>
</html>

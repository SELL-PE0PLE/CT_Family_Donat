<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CT FAMILY Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ШРИФТ DynaPuff ТОЛЬКО ДЛЯ CT FAMILY -->
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            padding: 70px 16px 40px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            max-width: 420px;
            width: 100%;
        }

        /* ============================================
                   ГЛАВНАЯ СТРАНИЦА
                   ============================================ */
        #page-main {
            display: block;
        }

        #page-main.hidden {
            display: none;
        }

        .brand {
            text-align: center;
            padding: 6px 0 20px;
        }

        .brand-title {
            font-family: 'DynaPuff', cursive;
            font-weight: 800;
            font-size: 58px;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .brand-sub {
            font-family: 'DynaPuff', cursive;
            font-weight: 700;
            font-size: 28px;
            color: #d5d5dd;
            margin-top: 0px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* ===== ТАБЛЕТКА ДЛЯ КАТЕГОРИЙ ===== */
        .category-wrapper {
            background: #1a1a1a;
            border-radius: 28px;
            padding: 14px 14px 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-card {
            flex: 0 0 auto;
            width: 88px;
            background: #1f1f1f;
            border-radius: 14px;
            padding: 12px 4px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.12s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 96px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-card:active {
            transform: scale(0.94);
            background: #2a2a2a;
        }

        .category-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 4px;
            background: #141414;
        }

        .category-name {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 600;
            font-size: 12px;
            color: #f0f0f0;
            letter-spacing: 0.2px;
            line-height: 1.2;
        }

        .category-count {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            font-size: 9px;
            color: #7777aa;
            margin-top: 1px;
        }

        /* ===== КНОПКА "ПРЕДЛОЖЕНИЯ" ===== */
        .category-card.more {
            background: #1a1a1a;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0px;
        }

        .category-card.more:active {
            background: #262626;
        }

        .more-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0px;
        }

        .more-icon svg {
            width: 28px;
            height: 28px;
            stroke: #8888aa;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
        }

        .more-text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: #8888aa;
            line-height: 1.2;
        }

        .more-sub {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            font-size: 9px;
            color: #555577;
            margin-top: 0px;
        }

        /* ===== ПОПУЛЯРНОЕ ===== */
        .popular-section {
            margin-top: 28px;
        }

        .popular-title {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .popular-placeholder {
            background: #141414;
            border-radius: 22px;
            padding: 44px 20px;
            text-align: center;
            border: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .popular-placeholder p {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            font-size: 15px;
            color: #555577;
            letter-spacing: 0.5px;
        }

        /* ============================================
                   СТРАНИЦА КАТЕГОРИИ
                   ============================================ */
        #page-category {
            display: none;
        }

        #page-category.visible {
            display: block;
        }

        /* ===== ШАПКА КАТЕГОРИИ ===== */
        .category-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 0 24px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #d5d5dd;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 8px;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:active {
            opacity: 0.5;
        }

        .back-btn svg {
            width: 32px;
            height: 32px;
            stroke: #d5d5dd;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .category-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-header-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            object-fit: cover;
            background: #141414;
        }

        .category-header-title {
            font-family: 'DynaPuff', cursive;
            font-weight: 700;
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* ===== ТОВАРЫ (пустое место) ===== */
        .category-products {
            margin-top: 4px;
        }

        .empty-products {
            text-align: center;
            padding: 60px 20px;
            color: #555577;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 380px) {
            body {
                padding: 60px 12px 30px;
            }
            .brand-title {
                font-size: 44px;
            }
            .brand-sub {
                font-size: 22px;
                letter-spacing: 4px;
            }
            .category-wrapper {
                padding: 10px 10px 8px;
                border-radius: 22px;
            }
            .category-scroll {
                gap: 8px;
            }
            .category-card {
                width: 76px;
                min-height: 84px;
                padding: 10px 3px 8px;
                border-radius: 12px;
            }
            .category-card.more {
                width: 76px;
                min-height: 84px;
                padding: 10px 3px 8px;
            }
            .category-icon {
                width: 38px;
                height: 38px;
            }
            .category-name {
                font-size: 10px;
            }
            .more-icon svg {
                width: 24px;
                height: 24px;
            }
            .more-text {
                font-size: 11px;
            }
            .more-sub {
                font-size: 8px;
            }
            .popular-title {
                font-size: 18px;
            }
            .category-header-title {
                font-size: 22px;
            }
            .category-header-icon {
                width: 40px;
                height: 40px;
            }
            .back-btn svg {
                width: 28px;
                height: 28px;
            }
        }

        @media (max-height: 700px) {
            body {
                padding: 60px 16px 30px;
            }
            .brand-title {
                font-size: 44px;
            }
            .brand-sub {
                font-size: 22px;
            }
            .category-wrapper {
                padding: 10px 10px 8px;
            }
            .category-scroll {
                gap: 8px;
            }
            .category-card {
                width: 80px;
                min-height: 88px;
                padding: 10px 3px 8px;
            }
            .category-card.more {
                width: 80px;
                min-height: 88px;
                padding: 10px 3px 8px;
            }
            .category-icon {
                width: 40px;
                height: 40px;
            }
            .category-name {
                font-size: 11px;
            }
            .more-icon svg {
                width: 26px;
                height: 26px;
            }
            .more-text {
                font-size: 11px;
            }
            .popular-section {
                margin-top: 20px;
            }
            .popular-placeholder {
                padding: 30px 16px;
            }
            .category-header-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ==========================================
        ГЛАВНАЯ СТРАНИЦА
        ========================================== -->
        <div id="page-main">

            <div class="brand">
                <div class="brand-title">CT FAMILY</div>
                <div class="brand-sub">Shop</div>
            </div>

            <div class="category-wrapper">
                <div class="category-scroll">

                    <!-- Telegram -->
                    <div class="category-card" onclick="openCategory('Telegram', 'https://i.ibb.co/xQvRq6x/telegram-6896827-1280.png')">
                        <img class="category-icon" src="https://i.ibb.co/xQvRq6x/telegram-6896827-1280.png" alt="Telegram">
                        <div class="category-name">Telegram</div>
                        <div class="category-count">0 товаров</div>
                    </div>

                    <!-- Brawl Stars -->
                    <div class="category-card" onclick="openCategory('Brawl Stars', 'https://i.ibb.co/FqypsfFr/IMG-20260827-204903-770.jpg')">
                        <img class="category-icon" src="https://i.ibb.co/FqypsfFr/IMG-20260827-204903-770.jpg" alt="Brawl Stars">
                        <div class="category-name">Brawl Stars</div>
                        <div class="category-count">0 товаров</div>
                    </div>

                    <!-- Roblox -->
                    <div class="category-card" onclick="openCategory('Roblox', 'https://i.ibb.co/vCCGRqBs/IMG-20260827-205156-738.jpg')">
                        <img class="category-icon" src="https://i.ibb.co/vCCGRqBs/IMG-20260827-205156-738.jpg" alt="Roblox">
                        <div class="category-name">Roblox</div>
                        <div class="category-count">0 товаров</div>
                    </div>

                    <!-- Clash Royale -->
                    <div class="category-card" onclick="openCategory('Clash Royale', 'https://i.ibb.co/G4DbyWJj/IMG-20260827-205425-705.jpg')">
                        <img class="category-icon" src="https://i.ibb.co/G4DbyWJj/IMG-20260827-205425-705.jpg" alt="Clash Royale">
                        <div class="category-name">Clash Royale</div>
                        <div class="category-count">0 товаров</div>
                    </div>

                    <!-- Clash of Clans -->
                    <div class="category-card" onclick="openCategory('Clash of Clans', 'https://i.ibb.co/svzv5TtD/IMG-20260827-205458-315.jpg')">
                        <img class="category-icon" src="https://i.ibb.co/svzv5TtD/IMG-20260827-205458-315.jpg" alt="Clash of Clans">
                        <div class="category-name">Clash of Clans</div>
                        <div class="category-count">0 товаров</div>
                    </div>

                    <!-- Standoff 2 -->
                    <div class="category-card" onclick="openCategory('Standoff 2', 'https://i.ibb.co/TxVCySY3/IMG-20260827-205336-497.jpg')">
                        <img class="category-icon" src="https://i.ibb.co/TxVCySY3/IMG-20260827-205336-497.jpg" alt="Standoff 2">
                        <div class="category-name">Standoff 2</div>
                        <div class="category-count">0 товаров</div>
                    </div>

                    <!-- Ещё / Предложения -->
                    <div class="category-card more" onclick="openMore()">
                        <div class="more-icon">
                            <svg viewBox="0 0 24 24">
                                <line x1="12" y1="4" x2="12" y2="20" />
                                <line x1="4" y1="12" x2="20" y2="12" />
                            </svg>
                        </div>
                        <div class="more-text">Ещё</div>
                        <div class="more-sub">Предложения</div>
                    </div>

                </div>
            </div>

            <div class="popular-section">
                <div class="popular-title">⭐ Популярное</div>
                <div class="popular-placeholder">
                    <p>Товары появятся позже</p>
                </div>
            </div>

        </div>

        <!-- ==========================================
        СТРАНИЦА КАТЕГОРИИ
        ========================================== -->
        <div id="page-category">

            <!-- Шапка -->
            <div class="category-header">
                <button class="back-btn" onclick="closeCategory()">
                    <svg viewBox="0 0 24 24">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>
                <div class="category-header-info">
                    <img class="category-header-icon" id="catHeaderIcon" src="" alt="">
                    <span class="category-header-title" id="catHeaderTitle">Категория</span>
                </div>
            </div>

            <!-- Список товаров (пусто) -->
            <div class="category-products" id="categoryProducts">
                <div class="empty-products">Товаров пока нет</div>
            </div>

        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.requestFullscreen();

        // ===== ОТКРЫТЬ КАТЕГОРИЮ =====
        function openCategory(name, icon) {
            // Прячем главную
            document.getElementById('page-main').classList.add('hidden');

            // Показываем страницу категории
            const pageCat = document.getElementById('page-category');
            pageCat.classList.add('visible');

            // Устанавливаем шапку
            document.getElementById('catHeaderIcon').src = icon;
            document.getElementById('catHeaderTitle').textContent = name;

            // Очищаем или показываем заглушку
            const container = document.getElementById('categoryProducts');
            container.innerHTML = `<div class="empty-products">Товаров пока нет</div>`;
        }

        // ===== ЗАКРЫТЬ КАТЕГОРИЮ =====
        function closeCategory() {
            document.getElementById('page-main').classList.remove('hidden');
            document.getElementById('page-category').classList.remove('visible');
        }

        // ===== КНОПКА "ПРЕДЛОЖЕНИЯ" =====
        function openMore() {
            tg.openLink('https://t.me/CT_FAMILY_DONAT/20');
        }
    </script>

</body>
                </html>
